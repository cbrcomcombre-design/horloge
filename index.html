<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Horloge</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{--bg:#000;--fg:#fff;--dim:#c8c8c8;--top:#3a3a3c;--bot:#2c2c2e;--op:1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
#w{height:100%;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;align-items:center;opacity:var(--op);-webkit-transition:opacity 2s;transition:opacity 2s}
#d{font-size:3.6vw;color:var(--dim);margin-bottom:5vw;text-align:center}
#d:first-letter{text-transform:uppercase}
#r{display:-webkit-flex;display:flex}
.c{position:relative;width:29vw;height:23vw;margin:0 .6vw;border-radius:2.2vw;background:-webkit-linear-gradient(top,var(--top) 0,var(--top) 50%,var(--bot) 50%,var(--bot) 100%);background:linear-gradient(to bottom,var(--top) 0,var(--top) 50%,var(--bot) 50%,var(--bot) 100%);font-size:19vw;line-height:23vw;text-align:center;font-variant-numeric:tabular-nums}
.c:after{content:"";position:absolute;left:0;right:0;top:50%;height:.35vw;margin-top:-.17vw;background:var(--bg)}
#q{width:80vw;height:14vw;margin-top:5vw;text-align:center;font-size:3.2vw;line-height:1.35;color:var(--dim)}
#q i{display:block;margin-top:.8vw;font-size:2.2vw;font-style:normal;opacity:.7}
#m{position:fixed;top:calc(env(safe-area-inset-top,0px) + 2.5vw);right:3vw;font-size:3.4vw;color:var(--dim)}
#h{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--dim);opacity:.5}
</style>
</head>
<body>
<div id="w">
<div id="d"></div>
<div id="r"><div class="c" id="hh">--</div><div class="c" id="mm">--</div><div class="c" id="ss">--</div></div>
<div id="q"></div>
<div id="m">--</div>
</div>
<div id="h">Touchez l’écran pour régler la luminosité</div>
<script>
(function () {
  var J = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  var M = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var levels = [1, 0.6, 0.3, 0.12];
  var lvl = 0;
  var root = document.documentElement;

  // ===== PLANNING D'ASSOMBRISSEMENT =====
  // 0 = dimanche, 1 = lundi ... 6 = samedi ; null = pas d'horaire, toujours allumé
  // on  = heure d'allumage le matin de ce jour
  // off = heure d'extinction le soir de ce jour
  var SCHEDULE = [
    null,
    { on: "07:00", off: "22:30" },
    { on: "07:00", off: "22:30" },
    { on: "07:00", off: "22:30" },
    { on: "08:00", off: "22:30" },
    { on: "07:00", off: "22:30" },
    null
  ];
  var DIM_LEVEL = 0.03;   // 0 = noir total, 1 = pleine luminosité
  var PEEK_LEVEL = 0.3;   // luminosité quand on touche l'écran la nuit
  var PEEK_MS = 10000;    // durée de l'aperçu en millisecondes
  var peekUntil = 0;
  var curOp = -1;
  function mins(s) {
    var a = s.split(":");
    return parseInt(a[0], 10) * 60 + parseInt(a[1], 10);
  }
  function isDimTime(n) {
    var t = n.getDay() * 1440 + n.getHours() * 60 + n.getMinutes();
    var W = 10080, d, s, nx, start, end;
    for (d = 0; d < 7; d++) {
      s = SCHEDULE[d];
      if (!s) { continue; }
      nx = SCHEDULE[(d + 1) % 7];
      start = d * 1440 + mins(s.off);
      end = (d + 1) * 1440 + (nx ? mins(nx.on) : 0);
      if ((t >= start && t < end) || (t + W >= start && t + W < end)) { return true; }
    }
    return false;
  }
  function applyLevel() {
    var n = new Date();
    var o = levels[lvl];
    if (isDimTime(n)) { o = (n.getTime() < peekUntil) ? PEEK_LEVEL : DIM_LEVEL; }
    if (o !== curOp) {
      curOp = o;
      root.style.setProperty("--op", o);
    }
  }
  function p(n) { return n < 10 ? "0" + n : "" + n; }
  function $(id) { return document.getElementById(id); }
  function setLevel(i) {
    lvl = i;
    applyLevel();
    try { localStorage.setItem("lvl", String(lvl)); } catch (e) {}
  }
  try {
    var v = parseInt(localStorage.getItem("lvl"), 10);
    if (v >= 0 && v < levels.length) { setLevel(v); }
  } catch (e) {}
  var Q = [
    ["Nouvelle journée, nouvelle chance. Tu peux la rendre belle.", ""],
    ["Commence doucement, mais commence. Le reste suivra.", ""],
    ["Aujourd’hui, tu fais de ton mieux, et c’est déjà énorme.", ""],
    ["Une seule chose à la fois. Tu vas y arriver.", ""],
    ["Tu es capable de bien plus que tu ne le crois.", ""],
    ["Respire. Cette journée t’appartient.", ""],
    ["Un petit pas aujourd’hui vaut mieux qu’un grand pas jamais fait.", ""],
    ["Ce matin, choisis d’être fier de toi ce soir.", ""],
    ["Tu n’as pas besoin d’être parfait, juste d’avancer.", ""],
    ["Chaque effort d’aujourd’hui prépare le toi de demain.", ""],
    ["Souris : la journée commence, et tu as de quoi la réussir.", ""],
    ["Fais d’abord le plus important. Le reste sera plus léger.", ""],
    ["Tu as déjà traversé des jours difficiles. Celui-ci, tu le gères aussi.", ""],
    ["Aujourd’hui, sois gentil avec toi-même.", ""],
    ["Prends ton temps, garde ton cap.", ""],
    ["Tout ce qui compte aujourd’hui, c’est de faire de ton mieux.", ""],
    ["Tu as de l’énergie, des idées et du courage. Utilise-les.", ""],
    ["Une bonne journée se construit dès les premières minutes.", ""],
    ["Ne remets pas à demain ce qui te rendra fier aujourd’hui.", ""],
    ["Sois patient : les belles choses prennent du temps.", ""],
    ["Tu avances, même quand tu ne le vois pas.", ""],
    ["Ce matin, tu as le droit de recommencer comme tu veux.", ""],
    ["Reste simple : une tâche, puis la suivante.", ""],
    ["Ta journée sera ce que tu décides d’en faire.", ""],
    ["Garde le calme, garde le sourire, garde le rythme.", ""],
    ["Chaque victoire, même petite, mérite d’être célébrée.", ""],
    ["Tu es sur le bon chemin. Continue.", ""],
    ["Donne le meilleur de toi, et accepte le reste avec calme.", ""],
    ["Aujourd’hui sera une bonne journée, parce que tu vas t’y mettre.", ""],
    ["Bravo d’être debout. Maintenant, on y va.", ""]
  ];
  var lastQ = -1;
  function showQuote(n) {
    var i = Math.floor(n.getTime() / 180000) % Q.length;
    if (i === lastQ) { return; }
    lastQ = i;
    var q = $("q");
    q.textContent = Q[i][0];
    if (Q[i][1]) {
      var a = document.createElement("i");
      a.textContent = Q[i][1];
      q.appendChild(a);
    }
  }
  function tick() {
    var n = new Date();
    applyLevel();
    showQuote(n);
    $("hh").textContent = p(n.getHours());
    $("mm").textContent = p(n.getMinutes());
    $("ss").textContent = p(n.getSeconds());
    $("d").textContent = J[n.getDay()] + " " + n.getDate() + " " + M[n.getMonth()] + " " + n.getFullYear();
  }
  var W_URL = "https://api.open-meteo.com/v1/forecast?latitude=45.764&longitude=4.8357&current=temperature_2m,weather_code,is_day&timezone=auto";
  function icon(c, day) {
    if (c === 0 || c === 1) { return day ? (c === 0 ? "☀️" : "🌤️") : "🌙"; }
    if (c === 2) { return "⛅"; }
    if (c === 3) { return "☁️"; }
    if (c === 45 || c === 48) { return "🌫️"; }
    if ((c >= 51 && c <= 57) || (c >= 80 && c <= 82)) { return "🌦️"; }
    if (c >= 61 && c <= 67) { return "🌧️"; }
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) { return "🌨️"; }
    if (c >= 95) { return "⛈️"; }
    return "";
  }
  function showWeather(w) {
    $("m").textContent = w ? w.i + " " + w.t + "°" : "--";
  }
  function loadWeather() {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", W_URL, true);
      x.timeout = 10000;
      x.onload = function () {
        if (x.status !== 200) { return; }
        try {
          var c = JSON.parse(x.responseText).current;
          var w = { i: icon(c.weather_code, c.is_day === 1), t: Math.round(c.temperature_2m) };
          showWeather(w);
          try { localStorage.setItem("w", JSON.stringify(w)); } catch (e) {}
        } catch (e) {}
      };
      x.onerror = function () {};
      x.ontimeout = function () {};
      x.send();
    } catch (e) {}
  }
  try {
    var saved = localStorage.getItem("w");
    if (saved) { showWeather(JSON.parse(saved)); }
  } catch (e) {}
  loadWeather();
  setInterval(loadWeather, 600000);
  tick();
  setInterval(tick, 1000);
  setTimeout(function () { $("h").style.display = "none"; }, 20000);
  document.body.addEventListener("click", function () {
    $("h").style.display = "none";
    if (isDimTime(new Date())) {
      peekUntil = new Date().getTime() + PEEK_MS;
      applyLevel();
    } else {
      setLevel((lvl + 1) % levels.length);
    }
  });
})();
</script>
</body>
</html>
